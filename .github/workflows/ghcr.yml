name: ghcr
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: github.ref_name or sha)"
        required: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then TAG="sha-${GITHUB_SHA::12}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/wudilyy999/owndesk-web:$TAG" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/wudilyy999/owndesk-worker:$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push web+worker
        run: |
          docker buildx build --target web \
            --tag "${{ steps.meta.outputs.web }}" \
            --tag "ghcr.io/wudilyy999/owndesk-web:latest" \
            --push .
          docker buildx build --target worker \
            --tag "${{ steps.meta.outputs.worker }}" \
            --tag "ghcr.io/wudilyy999/owndesk-worker:latest" \
            --push .
      # Workstation image is large; publish on demand from a machine with enough disk:
      #   docker build -t ghcr.io/wudilyy999/owndesk-workstation:0.7.0 workstation && docker push ...
